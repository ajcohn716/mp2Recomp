name: mp2-sdk
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - setuptools<81
  - clang=21
  - clangxx=21
  - lld=21
  - gxx_linux-64=14
  - sysroot_linux-64=2.28
  - cmake=4
  - ninja
  - pkg-config
  - sdl2=2.30
  - sdl2_ttf=2
  - gtk3
  - glib
  - zlib
  - expat
  - patchelf
  - conda-pack=0.8
  - pip:
      - splat64[mips]==0.50.1
      - spimdisasm==1.42.4
      - PyYAML==6.0.3
