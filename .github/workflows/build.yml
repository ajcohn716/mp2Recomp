name: Platform checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Audit source and bootstrap pinned dependencies
        run: |
          python tools/audit_repository.py
          python tools/bootstrap.py
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-SDL2
            mingw-w64-clang-x86_64-SDL2_ttf
      - name: Build native platform check without a ROM
        shell: msys2 {0}
        run: |
          cmake -S . -B build/check -G Ninja -DMP2_PORTABILITY_CHECK=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build build/check --target mp2recomp -j 3
          ./build/check/mp2recomp.exe --self-test
      - name: Installer and GUI checks
        run: |
          python -m pip install -r tools/installer-requirements.txt
          python -m unittest discover -s tests -p test_installer.py -v
          python install.py --gui-smoke-test
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build libsdl2-dev libsdl2-ttf-dev libgtk-3-dev fonts-dejavu-core xvfb libegl1 libopengl0
      - name: Audit and test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python3 -m venv build/test-env
          build/test-env/bin/pip install -r tools/installer-requirements.txt
          python3 tools/audit_repository.py
          build/test-env/bin/python -m unittest discover -s tests -p test_installer.py -v
          build/test-env/bin/python install.py --gui-smoke-test
          tools/test_settings.sh
