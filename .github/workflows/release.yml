name: Installer release
on:
  workflow_dispatch:
    inputs:
      sdk_run_id:
        description: 'Reuse SDK artifacts from a verified run with matching dependency pins/toolchain recipe (blank rebuilds)'
        type: string
        default: ''
  push:
    tags: ['v*']
concurrency:
  group: installer-release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  sdk:
    if: inputs.sdk_run_id == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: windows-2022
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bootstrap source dependencies (no ROM)
        run: |
          python tools/audit_repository.py
          python tools/bootstrap.py
      - if: runner.os == 'Linux'
        name: Install runtime-data test display
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth
      - if: runner.os == 'Linux'
        uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462
        with:
          environment-file: tools/dependency-environment.yml
          cache-environment: true
      - if: runner.os == 'Linux'
        name: Build Linux dependency pack
        shell: micromamba-shell {0}
        run: python tools/build_dependency_pack.py --toolchain "$CONDA_PREFIX" --python "$CONDA_PREFIX/bin/python" --platform linux-x86_64
      - if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-SDL2
            mingw-w64-clang-x86_64-SDL2_ttf
            mingw-w64-clang-x86_64-openssl
      - if: runner.os == 'Windows'
        name: Install generation tools into a relocatable Python distribution
        shell: pwsh
        run: |
          python -m pip install splat64[mips]==0.50.1 spimdisasm==1.42.4 PyYAML==6.0.3
          $python = (Get-Command python).Source
          $toolchain = Join-Path $env:RUNNER_TEMP 'msys64/clang64'
          python tools/build_dependency_pack.py --toolchain "$toolchain" --python "$python" --platform windows-x86_64
      - name: Upload dependency packs and metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sdk-${{ matrix.platform }}
          compression-level: 0
          path: |
            dist/mp2recomp-sdk-*.tar.gz
            dist/mp2recomp-sdk-*.zip
            dist/mp2recomp-sdk-*.json
  installer:
    if: always() && (needs.sdk.result == 'success' || (needs.sdk.result == 'skipped' && inputs.sdk_run_id != ''))
    needs: sdk
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.sdk_run_id || github.run_id }}
          pattern: sdk-*
          merge-multiple: true
          path: dist/metadata
      - name: Install Linux Qt packaging and display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xkb1 libxcb-shape0 libxcb-util1 libxcb-cursor0 libxkbcommon-x11-0 xvfb xauth
      - name: Install packaging tools
        run: python -m pip install -r tools/installer-requirements.txt
      - name: Test installer defaults and validation
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -p test_installer.py -v
      - name: Build self-contained GUI and CLI installer
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('test-{0}', github.run_id) }}
          REPOSITORY: ${{ github.repository }}
        run: python tools/package_installer.py --bundle-sdk --metadata dist/metadata --tag "$env:RELEASE_TAG" --repository "$env:REPOSITORY"
        shell: pwsh
      - name: Test packaged CLI and GUI
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          $exe = if ($IsWindows) {'dist/installer/mp2recomp-installer/mp2recomp-installer.exe'} else {'dist/installer/mp2recomp-installer/mp2recomp-installer'}
          & $exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($IsWindows) { & $exe --gui-smoke-test }
          else {
            $env:QT_QPA_PLATFORM = 'xcb'
            xvfb-run -a $exe --gui-smoke-test
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installer-${{ runner.os }}
          compression-level: 0
          path: |
            dist/mp2recomp-installer-*.tar.gz
            dist/mp2recomp-installer-*.zip
            dist/mp2recomp-installer-*.sha256
  release:
    if: always() && github.ref_type == 'tag' && needs.installer.result == 'success'
    needs: installer
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          merge-multiple: true
          path: artifacts
      - name: Download reused dependency packs for release assets
        if: inputs.sdk_run_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.sdk_run_id }}
          pattern: sdk-*
          merge-multiple: true
          path: artifacts
      - name: Package matching integration source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python tools/audit_repository.py
          git archive --format=tar.gz --prefix="mp2recomp-$RELEASE_TAG/" -o "artifacts/mp2recomp-source-$RELEASE_TAG.tar.gz" HEAD
          cd artifacts
          sha256sum mp2recomp-*.tar.gz mp2recomp-*.zip > SHA256SUMS
      - name: Create draft release with installers and dependency packs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if test -f "docs/releases/$RELEASE_TAG.md"; then
            gh release create "$RELEASE_TAG" --draft --title "mp2Recomp $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md" artifacts/*
          else
            gh release create "$RELEASE_TAG" --draft --title "mp2Recomp $RELEASE_TAG" --generate-notes artifacts/*
          fi
